format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "bold fg:fossil_metrics_added_style_fg bg:fossil_metrics_added_style_bg"
deleted_style = "bold fg:fossil_metrics_deleted_style_fg bg:fossil_metrics_deleted_style_bg"

