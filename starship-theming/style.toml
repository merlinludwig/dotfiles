format = "[\\($hash$tag\\)]($style) "
style = "bold fg:git_commit_fg bg:git_commit_bg"

[git_metrics]
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
added_style = "bold fg:git_metrics_added_style_fg bg:git_metrics_added_style_bg"
deleted_style = "bold fg:git_metrics_deleted_style_fg bg:git_metrics_deleted_style_bg"

[git_state]
format = "\\([$state( $progress_current/$progress_total)]($style)\\) "
style = "bold fg:git_state_fg bg:git_state_bg"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold fg:git_status_fg bg:git_status_bg"
stashed = '\$${count} '
ahead = "⇡${count} "
behind = "⇣${count} "
conflicted = "=${count} "
deleted = "✘${count} "
renamed = "»${count} "
modified = "!${count} "
staged = "+${count} "
untracked = "?${count} "

