# rainbow.toml -- WIZARD TEMPLATE, not a valid starship.toml on its own.
#
# UNLIKE classic.toml: Rainbow genuinely sets a distinct background PER
# MODULE -- confirmed directly from p10k-rainbow.zsh (POWERLEVEL9K_DIR_
# BACKGROUND=4, VCS_CLEAN_BACKGROUND=2, VCS_MODIFIED_BACKGROUND=3,
# STATUS_OK_BACKGROUND=0, COMMAND_EXECUTION_TIME_BACKGROUND=3, etc. -- every
# module carries its own *_BACKGROUND, absent in Classic). So Rainbow is
# exactly the case our original isolated-capsule architecture was designed
# for: no adaptation needed the way classic.toml required. Each module wraps
# itself in its OWN {HEAD}/{TAIL} against its OWN distinct {BG:mod} -- no
# shared background placeholder, no wizard-level inter-module divider.
#
# Placeholders resolved by the wizard before writing the final config:
#   {HEAD}        -> opening cap glyph for this module's capsule, resolved
#                     as fg:{BG:mod} with no bg (transparent), matching how
#                     real starship powerline presets cap a colored block
#                     against the terminal's default background.
#   {TAIL}        -> closing cap glyph, same treatment, fg:{BG:mod}, no bg.
#   {PADDING}     -> " " or "" (icon-padding choice, #5), placed once after
#                     $symbol -- same semantics as lean.toml/classic.toml.
#   {PREFIX:mod}   -> "on "/"via "/etc. or ""
#   {FG:mod} / {BG:mod} -> this module's own palette fg/bg references
#
# `disabled = false` folded into the same five modules that default to
# disabled=true in vanilla Starship: os, azure, direnv, kubernetes, status.
#
# Confirmed from p10k-rainbow.zsh: os_icon and prompt_char are BOTH
# commented out (inactive) by default here too -- same as Classic, unlike
# Lean. Default active module set is directory/git_branch/git_status only.
# Their tables are kept below in case the wizard's icon/character steps
# turn them on. PROMPT_CHAR_BACKGROUND is explicitly transparent even in
# Rainbow (POWERLEVEL9K_PROMPT_CHAR_BACKGROUND=, empty) -- character, if
# enabled, does not get its own colored capsule the way other modules do.
"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
continuation_prompt = "[∙](bright-black) "
scan_timeout = 30
command_timeout = 500
palette = "rainbow"
format = "[╭─](fg:242)$directory$git_branch$git_status$fill$status$cmd_duration$jobs$direnv$python$conda$golang$nodejs$ruby$lua$java$perl$php$scala$haskell$kubernetes$terraform$aws$azure$gcloud$container$username$hostname$nix_shell$time[ ─╮](fg:242)$line_break[╰─ ](fg:242)"
right_format = "[ ─╯](fg:242)"

[os]
disabled = false
format = "[](fg:7)[$symbol](fg:232 bg:7)[](fg:7)"

[directory]
format = "[](fg:4)[ $path](fg:254 bg:4)[$read_only](fg:196 bg:4)[](fg:4)"
read_only = " 󰌾"

[git_branch]
format = "[](fg:2)[$symbol $branch(:$remote_branch)](fg:0 bg:2)[](fg:2)"
symbol = " "

[git_status]
format = "([](fg:3)[$conflicted](fg:196 bg:3)[$staged$modified$renamed$deleted$typechanged](fg:178 bg:3)[$untracked](fg:39 bg:3)[$ahead_behind$stashed](fg:244 bg:3)[](fg:3))"

[status]
disabled = false
format = "[](fg:1)[$symbol $status](bold fg:3 bg:1)[](fg:1)"
symbol = " "

[cmd_duration]
format = "[](fg:3)[ $duration](fg:0 bg:3)[](fg:3)"

[jobs]
format = "[](fg:0)[$symbol $number](fg:6 bg:0)[](fg:0)"

[direnv]
disabled = false
format = "[](fg:0)[$symbol $loaded/$allowed](fg:3 bg:0)[](fg:0)"
symbol = " "

[python]
format = "[](fg:4)[${symbol} ${pyenv_prefix}(${version} )(\\($virtualenv\\) )](fg:0 bg:4)[](fg:4)"
symbol = " "

[conda]
format = "[](fg:4)[$symbol $environment](fg:0 bg:4)[](fg:4)"
symbol = " "

[golang]
format = "[](fg:2)[$symbol ($version )](fg:255 bg:2)[](fg:2)"
symbol = " "

[nodejs]
format = "[](fg:2)[$symbol ($version )](fg:7 bg:2)[](fg:2)"
symbol = " "

[ruby]
format = "[](fg:1)[$symbol ($version )](fg:0 bg:1)[](fg:1)"
symbol = " "

[lua]
format = "[](fg:4)[$symbol ($version )](fg:0 bg:4)[](fg:4)"
symbol = " "

[java]
format = "[](fg:7)[$symbol ($version )](fg:1 bg:7)[](fg:7)"
symbol = " "

[perl]
format = "[](fg:4)[$symbol ($version )](fg:0 bg:4)[](fg:4)"
symbol = " "

[php]
format = "[](fg:5)[$symbol ($version )](fg:0 bg:5)[](fg:5)"
symbol = " "

[scala]
format = "[](fg:1)[$symbol ($version )](fg:0 bg:1)[](fg:1)"
symbol = " "

[haskell]
format = "[](fg:3)[$symbol ($version )](fg:0 bg:3)[](fg:3)"
symbol = " "

[kubernetes]
disabled = false
format = "[](fg:5)[$symbol $context( \\($namespace\\))](fg:7 bg:5)[](fg:5)"
symbol = "󱃾 "

[terraform]
format = "[](fg:0)[$symbol $workspace](fg:4 bg:0)[](fg:0)"
symbol = " "

[aws]
format = "[](fg:1)[$symbol ($profile )(\\($region\\) )(\\[$duration\\] )](fg:7 bg:1)[](fg:1)"
symbol = " "

[azure]
disabled = false
format = "[](fg:4)[$symbol ($subscription)](fg:7 bg:4)[](fg:4)"
symbol = " "

[gcloud]
format = "[](fg:4)[$symbol $account(@$domain)(\\($region\\))](fg:7 bg:4)[](fg:4)"
symbol = "󱇶 "

[container]
format = "[](fg:3)[$symbol \\[$name\\]](fg:0 bg:3)[](fg:3)"
symbol = " "

[username]
format = "[](fg:0)[$user](fg:3 bg:0)[](fg:0)"

[hostname]
format = "[](fg:0)[$ssh_symbol $hostname](fg:3 bg:0)[](fg:0)"
ssh_symbol = " "

[nix_shell]
format = "[](fg:4)[$symbol $state( \\($name\\))](fg:0 bg:4)[](fg:4)"
symbol = " "

[character]
success_symbol = "[$symbol](bold fg:76) "
error_symbol = "[$symbol](bold fg:196) "

[time]
disabled = false
format = "[](fg:7)[$symbol $time](fg:0 bg:7)[](fg:7)"

[fill]
symbol = " "
style = "fg:242"

[palettes.rainbow]
fill_fg = "242"  # sourced: frame_color[2] (RULER/MULTILINE_FIRST_PROMPT_GAP_FOREGROUND)
time_fg = "0"  # sourced: TIME_FOREGROUND=0
time_bg = "7"  # sourced: TIME_BACKGROUND=7
aws_bg = "1"
aws_fg = "7"
azure_bg = "4"
azure_fg = "7"
character_error_fg = "196"
character_success_fg = "76"
cmd_duration_bg = "3"
cmd_duration_fg = "0"
conda_bg = "4"
conda_fg = "0"
container_bg = "3"
container_fg = "0"
directory_bg = "4"
directory_fg = "254"
directory_read_only_bg = "4"
directory_read_only_fg = "196"
direnv_bg = "0"
direnv_fg = "3"
gcloud_bg = "4"
gcloud_fg = "7"
git_branch_bg = "2"
git_branch_fg = "0"
git_status_bg = "3"
git_status_conflicted_fg = "196"
git_status_modified_fg = "178"
git_status_untracked_fg = "39"
git_status_neutral_fg = "244"
golang_bg = "2"
golang_fg = "255"
haskell_bg = "3"
haskell_fg = "0"
hostname_bg = "0"
hostname_fg = "3"
java_bg = "7"
java_fg = "1"
jobs_bg = "0"
jobs_fg = "6"
kubernetes_bg = "5"
kubernetes_fg = "7"
lua_bg = "4"
lua_fg = "0"
nix_shell_bg = "4"
nix_shell_fg = "0"
nodejs_bg = "2"
nodejs_fg = "7"
os_bg = "7"
os_fg = "232"
perl_bg = "4"
