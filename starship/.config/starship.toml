[aws]
format = "[on $symbol($profile )(\\($region\\) )(\\[$duration\\] )]($style)"
style = "bold fg:aws_fg bg:aws_bg"
symbol = "☁️  "
expiration_symbol = "X"

[azure]
format = "[on $symbol($subscription)]($style) "
style = "bold fg:azure_fg bg:azure_bg"
symbol = "󰠅 "

[battery]
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "
disabled = true

[buf]
format = "[with $symbol($version )]($style)"
style = "bold fg:buf_fg bg:buf_bg"
symbol = "🐃 "

[bun]
format = "[via $symbol($version )]($style)"
